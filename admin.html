<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · pen-pig</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
  <style>
    /* 后台专属布局：复用 style.css 的设计令牌与 .panel/.btn 等类，
       这里只补后台需要的 tab / 表单 / 列表结构 */
    body { background: var(--bg); color: #cfe9dd; }
    .admin-wrap { max-width: 920px; margin: 0 auto; padding: 96px 20px 80px; }
    .admin-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .admin-head h1 { font-size: 26px; letter-spacing: .5px; margin: 0; color: #eafff6; }
    .admin-head .sub { color: #6f8c80; font-size: 13px; }
    .admin-head .me { color: var(--amber); font-size: 13px; }

    /* 解锁屏 */
    .admin-lock { padding: 40px; max-width: 420px; margin: 8vh auto 0; text-align: center; }
    .admin-lock h2 { margin: 0 0 6px; color: #eafff6; font-size: 22px; }
    .admin-lock p { color: #6f8c80; margin: 0 0 20px; font-size: 14px; }
    .admin-lock .modal-input { width: 100%; text-align: center; margin-bottom: 14px; }
    .admin-lock .btn { width: 100%; }

    /* tabs */
    .admin-tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(70,243,167,.16); margin-bottom: 22px; flex-wrap: wrap; }
    .admin-tabs button {
      background: transparent; border: 0; color: #7fa093; padding: 10px 16px;
      font: 600 14px/1 "JetBrains Mono", ui-monospace, monospace; cursor: pointer;
      border-bottom: 2px solid transparent; letter-spacing: .3px;
    }
    .admin-tabs button:hover { color: #cfe9dd; }
    .admin-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .admin-tabpanel { display: none; }
    .admin-tabpanel.active { display: block; animation: fadeUp .35s ease both; }

    /* 通用表单 */
    .field { margin-bottom: 16px; }
    .field > label { display: block; font: 600 13px/1 "JetBrains Mono", monospace; color: #8fb3a6; margin-bottom: 6px; letter-spacing: .3px; }
    .field .hint { color: #5d7a6f; font-size: 12px; margin-top: 4px; }
    .modal-input, .modal-textarea { width: 100%; }
    .grp { border: 1px solid rgba(70,243,167,.14); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; background: rgba(11,16,23,.5); }
    .grp h3 { margin: 0 0 12px; font-size: 13px; color: var(--amber); letter-spacing: 1px; text-transform: uppercase; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px){ .row2 { grid-template-columns: 1fr; } }

    .ops { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .status-line { font: 13px/1.5 "JetBrains Mono", monospace; color: #8fb3a6; margin: 10px 0; min-height: 18px; }
    .status-line.ok { color: var(--accent); }
    .status-line.err { color: #ff7b7b; }

    /* 文章列表 */
    .post-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid rgba(70,243,167,.12); border-radius: 10px; margin-bottom: 10px; background: rgba(11,16,23,.5); }
    .post-item .pi-main { flex: 1; min-width: 0; }
    .post-item .pi-title { color: #eafff6; font-weight: 600; }
    .post-item .pi-meta { color: #6f8c80; font-size: 12px; margin-top: 3px; }
    .post-item .pi-tags { color: var(--amber); font-size: 12px; }

    /* 评论列表 */
    .cm-item { border: 1px solid rgba(70,243,167,.12); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: rgba(11,16,23,.5); }
    .cm-item.pinned { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(255,180,84,.25) inset; }
    .cm-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
    .cm-nick { color: var(--accent); font-weight: 600; }
    .cm-floor { color: #6f8c80; font-size: 12px; }
    .cm-post { color: var(--amber); font-size: 12px; }
    .cm-time { color: #5d7a6f; font-size: 12px; }
    .cm-body { color: #cfe9dd; white-space: pre-wrap; word-break: break-word; }
    .cm-body img { max-width: 160px; max-height: 160px; border-radius: 6px; margin-top: 6px; }
    .cm-img-link { color: #7fa093; font-size: 12px; }
    .cm-ops { display: flex; gap: 8px; margin-top: 8px; }

    /* 验证码 */
    .captcha-row { display: flex; align-items: center; gap: 10px; }
    .captcha-img { height: 46px; border-radius: 6px; border: 1px solid rgba(70,243,167,.2); cursor: pointer; background: #06080c; }
    .captcha-input { flex: 1; max-width: 160px; }

    .mini { font-size: 12px; padding: 6px 12px; }
    .empty { color: #6f8c80; text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <header class="nav" id="top">
    <a class="nav-logo" href="index.html" aria-label="返回首页">
      <span class="nav-user">pen-pig@home</span><span class="nav-colon">:</span><span class="nav-path">~</span><span class="nav-dollar">$</span>
    </a>
    <nav class="nav-links" aria-label="页面导航">
      <a href="index.html"><i>00</i>首页</a>
      <a href="blog.html"><i>05</i>博客</a>
      <a href="site-demo.html"><i>06</i>试用</a>
    </nav>
  </header>

  <div class="admin-wrap">
    <div class="admin-head">
      <div>
        <h1>后台管理</h1>
        <span class="sub">站点文案 · 文章 · 评论 · 密码</span>
      </div>
      <span class="me" id="meState" hidden></span>
    </div>

    <!-- 解锁屏 -->
    <section class="admin-lock panel" id="lockScreen">
      <h2>需要解锁</h2>
      <p>输入发布密码以进入后台</p>
      <input id="pwInput" class="modal-input" type="password" autocomplete="current-password" placeholder="发布密码">
      <button id="btnUnlock" class="btn btn-primary">解锁</button>
      <p class="modal-error" id="pwError" hidden></p>
    </section>

    <!-- 主面板 -->
    <section id="adminPanel" hidden>
      <nav class="admin-tabs" id="tabs">
        <button data-tab="site" class="active">站点文案</button>
        <button data-tab="posts">文章</button>
        <button data-tab="comments">评论</button>
        <button data-tab="password">密码</button>
      </nav>

      <!-- 站点文案 -->
      <div class="admin-tabpanel active" id="tab-site">
        <div id="siteForm"></div>
        <div class="ops">
          <button class="btn btn-primary" id="btnSaveSite">保存文案</button>
          <button class="btn btn-ghost" id="btnResetSite">恢复默认（清空覆盖）</button>
        </div>
        <div class="status-line" id="siteStatus"></div>
      </div>

      <!-- 文章 -->
      <div class="admin-tabpanel" id="tab-posts">
        <div class="ops" style="margin-bottom:16px;">
          <button class="btn btn-primary" id="btnNewPost">＋ 新建文章</button>
          <button class="btn btn-ghost" id="btnRefreshPosts">刷新</button>
        </div>
        <div id="postList"></div>
        <div class="status-line" id="postsStatus"></div>
      </div>

      <!-- 评论 -->
      <div class="admin-tabpanel" id="tab-comments">
        <div class="ops" style="margin-bottom:16px;">
          <button class="btn btn-ghost" id="btnRefreshComments">刷新</button>
        </div>
        <div id="commentList"></div>
        <div class="status-line" id="commentsStatus"></div>
      </div>

      <!-- 密码 -->
      <div class="admin-tabpanel" id="tab-password">
        <div class="grp">
          <h3>修改发布密码</h3>
          <div class="field">
            <label>当前密码</label>
            <input id="pwOld" class="modal-input" type="password" autocomplete="current-password">
          </div>
          <div class="field">
            <label>新密码（至少 8 位）</label>
            <input id="pwNew" class="modal-input" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label>人机验证</label>
            <div class="captcha-row">
              <img id="pwCaptchaImg" class="captcha-img" alt="验证码" title="点我看不清，换一张">
              <input id="pwCaptchaAns" class="modal-input captcha-input" type="text" placeholder="输入图中字符" autocomplete="off">
            </div>
          </div>
          <div class="ops">
            <button class="btn btn-primary" id="btnChangePw">确认修改</button>
          </div>
        </div>
        <div class="status-line" id="pwStatus"></div>
      </div>
    </section>
  </div>

  <!-- 文章编辑器（模态） -->
  <div class="modal" id="editorModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="edHeading">新建文章</h3>
        <button class="modal-x" id="edClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>标题</label>
          <input id="edTitle" class="modal-input" type="text" maxlength="120">
        </div>
        <div class="row2">
          <div class="modal-field">
            <label>日期</label>
            <input id="edDate" class="modal-input" type="date">
          </div>
          <div class="modal-field">
            <label>标签（逗号分隔）</label>
            <input id="edTags" class="modal-input" type="text" placeholder="OI, 随笔">
          </div>
        </div>
        <div class="modal-field">
          <label>正文（支持 Markdown：# 标题、**粗体**、`代码`、&gt; 引用、- 列表、1. 序号、[链接](https://...)）</label>
          <textarea id="edBody" class="modal-textarea" rows="14"></textarea>
        </div>
        <div class="modal-error" id="edError" hidden></div>
      </div>
      <div class="modal-ops">
        <button class="btn btn-ghost mini" id="edCancel">取消</button>
        <button class="btn btn-primary" id="edSave">保存到草稿</button>
        <button class="btn btn-primary" id="edPublish">发布上线</button>
      </div>
    </div>
  </div>

  <!-- 确认框（删除 / 发布验证码） -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3 id="cfHeading">确认</h3></div>
      <div class="modal-body">
        <p id="cfText" style="color:#cfe9dd;margin:0 0 14px;"></p>
        <div class="field" id="cfCaptchaWrap" hidden>
          <label>人机验证</label>
          <div class="captcha-row">
            <img id="cfCaptchaImg" class="captcha-img" alt="验证码" title="点我换一张">
            <input id="cfCaptchaAns" class="modal-input captcha-input" type="text" placeholder="输入图中字符" autocomplete="off">
          </div>
        </div>
        <div class="modal-error" id="cfError" hidden></div>
      </div>
      <div class="modal-ops">
        <button class="btn btn-ghost mini" id="cfCancel">取消</button>
        <button class="btn btn-primary" id="cfOk">确认</button>
      </div>
    </div>
  </div>

  <script src="assets/js/admin.js?v=1" defer></script>
</body>
</html>
