<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pen-pig 的个人主页</title>
  <meta name="description" content="pen-pig 的个人主页。项目代码由 AI 生成。">
  <meta property="og:title" content="pen-pig 的个人主页">
  <meta property="og:description" content="pen-pig 的个人主页。项目代码由 AI 生成。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pen-pig.github.io/">
  <meta name="theme-color" content="#06080c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306080c'/%3E%3Cpath d='M18 20l16 12-16 12' stroke='%2346f3a7' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body class="home">

  <!-- 氛围层：扫描线 / 噪点 / 光标辉光 -->
  <div class="fx fx-scan" aria-hidden="true"></div>
  <div class="fx fx-noise" aria-hidden="true"></div>
  <div class="fx fx-cursor" id="cursorGlow" aria-hidden="true"></div>

  <!-- ============ 导航 ============ -->
  <header class="nav" id="top">
    <a class="nav-logo" href="#top" aria-label="回到顶部">
      <span class="nav-user">pen-pig@home</span><span class="nav-colon">:</span><span class="nav-path">~</span><span class="nav-dollar">$</span>
    </a>
    <nav class="nav-links" aria-label="页面导航">
      <a href="blog.html">BLOG<i aria-hidden="true">→</i></a>
    </nav>
  </header>

  <main>

    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-inner">

        <div class="hero-id">
          <p class="tape"><span>PERSONAL HOMEPAGE</span><span class="tape-dim">// WORKLOG</span></p>
          <h1 class="hero-name"><span id="heroName">pen-pig</span><span class="caret" aria-hidden="true"></span></h1>
          <div class="hero-cta">
            <a class="btn btn-ghost" href="blog.html" id="heroCtaNotes">BLOG<i aria-hidden="true">→</i></a>
          </div>
        </div>

        <div class="hero-term">
          <div class="term panel">
            <div class="term-bar">
              <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="term-title">pen-pig: ~/boot.log</span>
              <span class="term-size">80×24</span>
            </div>
            <div class="term-body" id="bootLog">
              <p><span class="t">[    0.000000]</span> booting pen-pig.homepage ...</p>
              <p><span class="t">[    0.118937]</span> loading: static assets</p>
              <p class="ok"><span class="t">[    1.000000]</span> done: ready ✓</p>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- 站点文案覆盖层要先于 main.js 执行：它负责把后台改过的文案贴到 DOM 上 -->
  <script src="assets/js/site.js?v=2" defer></script>
  <script src="assets/js/main.js?v=3" defer></script>
</body>
</html>
